<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>치지직 무음 구간 건너뛰기 설정</title>
  <style>
    body {
      margin: 0; padding: 28px 16px;
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1117; color: #e6e9f0;
    }
    main { max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    h1 { font-size: 18px; margin: 0; flex: 1; }
    h2 { font-size: 13px; font-weight: 600; color: #9aa3b5; margin: 0 0 10px; }

    /* on/off switch */
    .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #9aa3b5; }
    .switch input { appearance: none; margin: 0; width: 38px; height: 22px; border-radius: 11px;
      background: #2a3145; position: relative; cursor: pointer; transition: background .15s; }
    .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #e6e9f0; transition: transform .15s; }
    .switch input:checked { background: #2563eb; }
    .switch input:checked::after { transform: translateX(16px); }
    .switch input:focus-visible, .preset:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }

    .presets { display: grid; gap: 6px; }
    .preset {
      display: flex; align-items: baseline; gap: 12px; text-align: left; width: 100%;
      background: #161923; color: inherit; border: 1px solid #232838; border-radius: 10px;
      padding: 10px 14px; cursor: pointer; font: inherit;
    }
    .preset:hover { border-color: #334155; }
    .preset[aria-checked="true"] { border-color: #2563eb; background: #1b2436; }
    .preset .name { font-weight: 600; width: 48px; flex: none; }
    .preset .desc { color: #98a1b3; flex: 1; }
    .preset .stat { color: #9aa3b5; font-size: 12px; font-variant-numeric: tabular-nums; }

    details { margin-top: 20px; }
    summary { cursor: pointer; color: #9aa3b5; }
    .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .row .t { flex: 1; }
    input[type=range] { width: 180px; }
    .val { width: 44px; text-align: right; color: #9aa3b5; font-variant-numeric: tabular-nums; }
    .link { background: none; border: 0; padding: 0; color: #60a5fa; font: inherit; cursor: pointer; }
    .link:hover { text-decoration: underline; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>치지직 무음 구간 건너뛰기</h1>
      <label class="switch"><span id="enabledText">켜짐</span><input type="checkbox" id="enabled" role="switch" /></label>
    </header>

    <h2 id="presetsTitle">얼마나 건너뛸까요?</h2>
    <div class="presets" id="presets" role="radiogroup" aria-labelledby="presetsTitle"></div>

    <details id="custom">
      <summary>직접 조정</summary>
      <label class="row">
        <span class="t">건너뛰기 강도</span>
        <input type="range" id="threshold" min="0.10" max="0.85" step="0.01" />
        <span class="val" id="thresholdVal"></span>
      </label>
      <label class="row">
        <span class="t">이보다 짧은 무음은 무시</span>
        <input type="range" id="minSkip" min="0.5" max="10" step="0.5" />
        <span class="val" id="minSkipVal"></span>
      </label>
      <button class="link" id="reset" hidden>프리셋 값으로 되돌리기</button>
    </details>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
